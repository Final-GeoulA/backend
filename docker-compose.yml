services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: geoula-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: geoula
      APP_USER_PASSWORD: geoula
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3m

  redis:
    image: redis:7-alpine
    container_name: geoula-redis
    ports:
      - "6379:6379"

volumes:
  oracle-data:
