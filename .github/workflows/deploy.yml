name: CD - Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/geoula/backend
            git pull origin develop
            ./gradlew clean bootJar
            docker build -t geoula-app:1.0 .
            docker save geoula-app:1.0 -o /tmp/geoula-app.tar
            sudo k3s ctr images import /tmp/geoula-app.tar
            kubectl rollout restart deployment/geoula-deploy
            kubectl rollout status deployment/geoula-deploy --timeout=120s
